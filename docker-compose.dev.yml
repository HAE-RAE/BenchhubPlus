version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: benchhub_postgres_dev
    environment:
      POSTGRES_DB: benchhub_plus_dev
      POSTGRES_USER: benchhub
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchhub -d benchhub_plus_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: benchhub_redis_dev
    ports:
      - "6380:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend (Development)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: benchhub_backend_dev
    environment:
      - DATABASE_URL=postgresql://benchhub:dev_password@postgres:5432/benchhub_plus_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=true
      - LOG_LEVEL=debug
      - FRONTEND_URL=http://localhost:3000
      - DEV_AUTH_BYPASS=true
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app  # Mount source code for development
      - ./logs:/app/logs
    command: ["python", "-m", "uvicorn", "apps.backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Celery Worker (Development)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        HRET_PREFETCH_MODEL: ${HRET_PREFETCH_MODEL:-}
        HRET_PREFETCH_REVISION: ${HRET_PREFETCH_REVISION:-}
    container_name: benchhub_worker_dev
    environment:
      - DATABASE_URL=postgresql://benchhub:dev_password@postgres:5432/benchhub_plus_dev
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEBUG=true
      - LOG_LEVEL=debug
      - HF_HOME=/app/.cache/huggingface
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
      - HF_HUB_DISABLE_TELEMETRY=1
      - TOKENIZERS_PARALLELISM=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app  # Mount source code for development
      - ./logs:/app/logs
      - /tmp:/tmp
      - hf_cache:/app/.cache/huggingface
    command: ["python", "-m", "celery", "-A", "apps.worker.celery_app", "worker", "--loglevel=debug", "--concurrency=1", "--queues", "evaluation,maintenance"]

  # Reflex Frontend (Development)
  reflex:
    build:
      context: .
      dockerfile: Dockerfile.reflex
    container_name: benchhub_reflex_dev
    environment:
      - API_BASE_URL=http://backend:8000
      - DEV_AUTH_BYPASS=true
    ports:
      - "3000:3000"
      - "8002:8002"
    depends_on:
      - backend
    # .web (node_modules/bun symlinks) uses named volume to avoid NFS issues.
    # Python source is bind-mounted to /app/reflex_frontend (matches COPY destination in Dockerfile).
    # This enables Reflex hot-reload: file save → instant reload, no image rebuild needed.
    volumes:
      - reflex_dev_web:/app/.web
      - ./apps/reflex_frontend/reflex_frontend:/app/reflex_frontend
    command: ["reflex", "run", "--env", "dev", "--backend-host", "0.0.0.0", "--backend-port", "8002", "--frontend-port", "3000", "--loglevel", "debug"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  # Celery Flower (Development)
  flower:
    image: mher/flower:0.9.7
    container_name: benchhub_flower_dev
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555
    ports:
      - "5556:5555"
    depends_on:
      - redis

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  hf_cache:
    driver: local
  reflex_dev_web:
    driver: local

networks:
  default:
    name: benchhub_dev_network
